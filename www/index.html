<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Arduino AI Coder</title>
<style>
:root {
  --bg: #f4f6f8; --card: #ffffff; --text: #17202a; --muted: #5d6b79;
  --line: #d9e0e6; --accent: #007aa3; --accent-text: #ffffff; --danger: #b3261e;
  --code-bg: #0f1720; --code-text: #e6edf3;
  --sat: max(12px, var(--safe-area-inset-top, 0px), env(safe-area-inset-top, 0px));
  --sab: max(12px, var(--safe-area-inset-bottom, 0px), env(safe-area-inset-bottom, 0px));
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #11161b; --card: #1a2128; --text: #e8edf2; --muted: #9aa7b3;
          --line: #2c3640; --accent: #38b6e0; --accent-text: #06222c; --danger: #f2b8b5; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
  font-size: 16px; -webkit-text-size-adjust: 100%; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: var(--sat) 16px 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  border-bottom: 1px solid var(--line); }
h1 { font-size: 1.15rem; margin: 0; }
main { padding: 12px 16px calc(var(--sab) + 24px); max-width: 760px; margin: 0 auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
select, input, textarea, button {
  font: inherit; color: var(--text); background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
select, input, textarea { width: 100%; }
textarea { resize: vertical; min-height: 96px; }
button { cursor: pointer; min-height: 44px; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .5; }
button.rec { background: var(--danger); color: #fff; border-color: var(--danger); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btns button { flex: 1 1 auto; }
.status { margin-top: 10px; font-size: .9rem; color: var(--muted); min-height: 1.3em; }
.tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; }
.tabs button { flex: 0 0 auto; min-height: 40px; padding: 6px 14px; }
.tabs button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.panel { display: none; }
.panel.active { display: block; }
#codeBox { direction: ltr; text-align: left; font-family: ui-monospace, Consolas, "Courier New", monospace;
  font-size: .85rem; background: var(--code-bg); color: var(--code-text); border-color: var(--code-bg);
  min-height: 260px; white-space: pre; overflow: auto; }
.text { white-space: pre-wrap; line-height: 1.6; min-height: 80px; }
.note { color: var(--muted); font-size: .8rem; margin: 12px 0 0; line-height: 1.5; }
.hist-item { padding: 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
.hist-item small { color: var(--muted); display: block; }
#toast { position: fixed; left: 50%; bottom: calc(var(--sab) + 12px); transform: translateX(-50%);
  background: #222; color: #fff; padding: 10px 16px; border-radius: 10px; max-width: 90vw;
  opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; text-align: center; }
#toast.show { opacity: 1; }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--text);
  width: min(92vw, 520px); padding: 16px; }
dialog::backdrop { background: rgba(0,0,0,.5); }
.field-row { display: flex; gap: 6px; }
.field-row button { flex: 0 0 auto; }
.check { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--text); }
.check input { width: auto; }
</style>
</head>
<body>
<header>
  <h1>Arduino AI Coder</h1>
  <div style="display:flex;gap:6px;align-items:center">
    <select id="langSel" aria-label="language" style="width:auto"></select>
    <button id="btnSettings" data-i="settings"></button>
  </div>
</header>
<main>
  <section class="card">
    <label for="boardSel" data-i="board"></label>
    <select id="boardSel"></select>
    <label for="tplSel" data-i="templates"></label>
    <select id="tplSel"></select>
    <label for="prompt" data-i="prompt_label"></label>
    <textarea id="prompt"></textarea>
    <div class="btns">
      <button id="btnGet" class="primary" data-i="get_code"></button>
      <button id="btnMod" data-i="modify"></button>
      <button id="btnMic" data-i="mic"></button>
      <button id="btnOta" data-i="add_ota"></button>
    </div>
    <div id="status" class="status"></div>
  </section>

  <section class="card">
    <div class="tabs" role="tablist">
      <button data-tab="code" class="active" data-i="tab_code"></button>
      <button data-tab="wiring" data-i="tab_wiring"></button>
      <button data-tab="expl" data-i="tab_expl"></button>
      <button data-tab="hist" data-i="tab_hist"></button>
    </div>
    <div id="panel-code" class="panel active">
      <textarea id="codeBox" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      <div class="btns">
        <button id="btnCopy" data-i="copy"></button>
        <button id="btnShare" data-i="share"></button>
        <button id="btnSim" data-i="simulate"></button>
      </div>
      <p class="note" data-i="upload_note"></p>
    </div>
    <div id="panel-wiring" class="panel"><div id="wiringBox" class="text"></div></div>
    <div id="panel-expl" class="panel"><div id="explBox" class="text"></div></div>
    <div id="panel-hist" class="panel">
      <div id="histList"></div>
      <div class="btns"><button id="btnClearHist" data-i="clear_history"></button></div>
    </div>
  </section>
</main>
<div id="toast" role="status"></div>
<dialog id="dlg">
  <form method="dialog" id="settingsForm">
    <div id="settingsFields"></div>
    <label class="check"><input type="checkbox" id="showSecrets"><span data-i="show_key"></span></label>
    <div class="btns">
      <button type="button" id="btnSave" class="primary" data-i="save"></button>
      <button type="button" id="btnCloseDlg" data-i="close"></button>
    </div>
  </form>
</dialog>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
